<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
  <title id="title">Alternativa B: Industrial Precision, Terminal de trazabilidad</title>
  <desc id="desc">Composición conceptual original de superficie oscura, recorrido gráfico y registro operacional. Sin interfaz implementada ni datos de negocio.</desc>
  <rect width="1100" height="760" fill="#101F20"/>
  <g font-family="system-ui, sans-serif" fill="#F4F6F2">
    <text x="40" y="40" font-size="16" letter-spacing="2">B / INDUSTRIAL PRECISION — TERMINAL DE TRAZABILIDAD</text>
    <text x="40" y="68" font-size="14" fill="#8B9A92">Boceto documental · propuesta para Fase 4 · sin datos operativos</text>
    <path d="M40 108V94H54 M66 108V122H52" fill="none" stroke="#C5F278" stroke-width="3"/>
    <text x="82" y="115" font-size="24" font-weight="600">LogisTech</text>
    <text x="742" y="112" font-size="16">El producto</text>
    <text x="874" y="112" font-size="16">Acceder</text>
