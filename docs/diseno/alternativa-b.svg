    <text x="40" y="253" font-size="48" font-weight="600" letter-spacing="-1">Control claro.</text>
    <text x="40" y="308" font-size="48" font-weight="600" letter-spacing="-1">Trazabilidad visible.</text>
    <text x="42" y="353" font-size="17" fill="#8B9A92">Identificar una caja debe ser el primer paso.</text>
    <path d="M42 395H245 M245 395L234 384 M245 395L234 406" fill="none" stroke="#C5F278" stroke-width="2"/>
    <rect x="670" y="180" width="390" height="242" rx="4" fill="#203934" stroke="#8B9A92"/>
    <text x="698" y="215" font-family="monospace" font-size="14" fill="#F4F6F2">RECORRIDO / CONCEPTO</text>
    <path d="M720 260H1008 M720 336H1008" stroke="#8B9A92"/>
    <circle cx="720" cy="260" r="6" fill="#C5F278"/>
    <circle cx="862" cy="260" r="6" fill="#C5F278"/>
    <circle cx="1008" cy="260" r="6" fill="#C5F278"/>
    <text x="698" y="298" font-family="monospace" font-size="14">01 Identificar</text>
    <text x="845" y="298" font-family="monospace" font-size="14">02 Registrar</text>
    <text x="942" y="374" font-family="monospace" font-size="14">03 Consultar</text>
    <text x="40" y="467" font-size="14" fill="#8B9A92" letter-spacing="2">VISTA DE TRABAJO / ESTRUCTURA PROPUESTA</text>
    <rect x="40" y="485" width="1020" height="218" fill="#203934" stroke="#8B9A92"/>
    <path d="M214 485V703 M810 485V703 M40 538H1060" stroke="#8B9A92"/>
    <text x="62" y="519" font-size="18">LogisTech</text>
    <text x="238" y="520" font-family="monospace" font-size="18">CAJAS / EMPRESA ASIGNADA</text>
    <text x="831" y="520" font-size="18">Contexto de caja</text>
    <path d="M55 557V588" stroke="#C5F278" stroke-width="4"/>
    <text x="70" y="578" font-size="16" fill="#C5F278">Cajas</text>
    <text x="70" y="620" font-size="16">Categorías</text>
    <text x="238" y="578" font-family="monospace" font-size="14">ID MANUAL / FILTROS / ESTADO</text>
    <path d="M238 598H785" stroke="#8B9A92"/>
    <text x="238" y="637" font-size="16">Sin registros disponibles</text>
    <text x="238" y="665" font-size="14" fill="#F4F6F2">El registro se alimentará de operaciones reales.</text>
    <text x="831" y="578" font-size="14">Identificador: —</text>
    <text x="831" y="610" font-size="14">Producto: —</text>
    <text x="831" y="642" font-size="14">Estado: sin selección</text>
    <text x="40" y="737" font-size="14" fill="#8B9A92">Petróleo para concentración · filas de registro · trazas y selección discretas</text>
  </g>
