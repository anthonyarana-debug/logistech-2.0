name: Application checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17.11-alpine3.23@sha256:05aa77262db9277fde6374bb2f901c9604b8a9373029e1a7993440c6aae48736
        env:
          POSTGRES_DB: logistech
          POSTGRES_USER: logistech
          POSTGRES_PASSWORD: solo-pruebas-no-es-un-secreto-real
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U logistech -d logistech"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build the backend test image
        run: docker build --target development -t logistech-ci-backend backend
      - name: Lint, check migrations and test with PostgreSQL
        run: |
          docker run --rm --network host -e DJANGO_SETTINGS_MODULE=config.settings.testing \
            logistech-ci-backend sh -ec 'ruff check --no-cache . &&
            python manage.py makemigrations --check --dry-run &&
            python -m pytest -q'

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container: node:24.19.0-bookworm-slim
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
